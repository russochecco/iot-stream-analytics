[project]
name = "iot-stream-analytics"
version = "0.1.0"
description = "Real-Time IoT Telemetry & Analytics Pipeline"
authors = [
    { name = "Francesco Russo", email = "russo.checco@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark[sql]==3.5.4",
    "influxdb-client>=1.9.0"
]

[tool.poetry]
packages = [{ include = "iot_stream_analytics", from = "src" }]

[dependency-groups]
dev = [
    "kafka-python>=3.0.11",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "e2e: marks tests as end-to-end integration tests (requires docker containers)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
